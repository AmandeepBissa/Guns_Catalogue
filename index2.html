<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="styles2.css" type="text/css">
    <title>Guns Catalogue</title>
</head>

<body>

<h1>Welcome! What can I interest you with!</h1>

<p style="background-color: rgb(47, 109, 56); color: rgb(223, 224, 137);">
Dear Stranger ,<br>
I can relate with the spark that brought you here.<br>
Here , I've got a selection of some good items you might wanna buy.
<hr>
</p>

<p>You see it is , as I say : <q><i>Gun</i> Rhymes with <i>Fun</i> for a reason stranger.</q></p>

<!-- ADD FORM -->
<div style="text-align:center;">
    <input id="category" placeholder="Category">
    <input id="name" placeholder="Name">
    <input id="feature" placeholder="Feature">
    <input id="price" placeholder="Price">
    <input id="link" placeholder="Link (e.g. Colt.html)">
    <button onclick="addGun()">Add Gun</button>
</div>

<br>

<table style="width:100%">
    <caption>Guns Catalogue</caption>

    <thead>
        <tr>
            <th></th>
            <th>Name</th>
            <th>FEATURE</th>
            <th>PRICE</th>
            <th>LEARN MORE</th>
            <th>ACTION</th>
        </tr>
    </thead>

    <tbody id="tableBody"></tbody>
</table>

<script>

async function loadGuns() {
    const res = await fetch("http://127.0.0.1:3000/guns");
    const guns = await res.json();

    const table = document.getElementById("tableBody");
    table.innerHTML = "";

    const grouped = {};

    guns.forEach(g => {
        if (!grouped[g.category]) grouped[g.category] = [];
        grouped[g.category].push(g);
    });

    for (let category in grouped) {
        const items = grouped[category];

        items.forEach((gun, index) => {
            table.innerHTML += `
                <tr>
                    ${index === 0 ? `<th rowspan="${items.length}">${category.toUpperCase()}</th>` : ""}
                    <td>${gun.name}</td>
                    <td>${gun.feature}</td>
                    <td>$${gun.price}</td>
                    <td><a href="${gun.link}" target="_blank">Learn More</a></td>
                    <td><button onclick="deleteGun(${gun.id})">Delete</button></td>
                </tr>
            `;
        });
    }
}

// ADD
async function addGun() {
    const gun = {
        category: document.getElementById("category").value,
        name: document.getElementById("name").value,
        feature: document.getElementById("feature").value,
        price: document.getElementById("price").value,
        link: document.getElementById("link").value
    };

    await fetch("http://127.0.0.1:3000/guns", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(gun)
    });

    loadGuns();
}

// DELETE
async function deleteGun(id) {
    await fetch(`http://127.0.0.1:3000/guns/${id}`, {
        method: "DELETE"
    });

    loadGuns();
}

// INIT
loadGuns();

</script>

</body>
</html>
